# As ações dos workflows e as imagens do Docker Compose estão fixadas por hash (um tag pode ser movido para outro
# conteúdo). O Dependabot abre um PR quando sai versão nova, com o hash atualizado.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
