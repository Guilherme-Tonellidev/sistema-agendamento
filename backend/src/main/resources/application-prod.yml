# Produção. DB_URL, DB_USERNAME e DB_PASSWORD vêm do ambiente do provedor de deploy.
logging:
  structured:
    format:
      # Logs em JSON, prontos para ferramentas de busca e monitoramento.
      console: ecs

spring:
  mail:
    properties:
      # Em produção as credenciais do e-mail nunca trafegam sem TLS.
      mail.smtp.starttls.required: true

# A documentação interativa existe só em desenvolvimento: em produção, /v3/api-docs e /swagger-ui entregariam o mapa
# completo da API (rotas, campos e regras de validação) a qualquer pessoa sem login.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
