spring:
  application:
    name: agendamento-api
  profiles:
    # Sem perfil informado, a aplicação sobe com as configurações de desenvolvimento.
    # Em produção, o Dockerfile define SPRING_PROFILES_ACTIVE=prod.
    default: local
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    # Evita consultas escondidas durante a renderização da resposta (anti-pattern Open Session in View).
    open-in-view: false
    hibernate:
      # O schema é responsabilidade do Flyway; o Hibernate só confere se as entidades batem com ele.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

server:
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
