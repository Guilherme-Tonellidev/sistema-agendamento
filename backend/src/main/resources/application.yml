spring:
  application:
    name: agendamento-api
  profiles:
    # Sem perfil informado, a aplicação sobe com as configurações de desenvolvimento.
    # Em produção, o Dockerfile define SPRING_PROFILES_ACTIVE=prod.
    default: local
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    # Evita consultas escondidas durante a renderização da resposta (anti-pattern Open Session in View).
    open-in-view: false
    hibernate:
      # O schema é responsabilidade do Flyway; o Hibernate só confere se as entidades batem com ele.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  rabbitmq:
    # Broker parado ou travado não segura a requisição: conectar, handshake (MensageriaConfig), abrir e fechar
    # canal e esperar a confirmação têm limite de 2 s cada.
    connection-timeout: 2s
    channel-rpc-timeout: 2s
    publisher-confirm-type: correlated
    listener:
      simple:
        retry:
          # 1 tentativa + 3 repetições, esperando 2 s, 6 s e 18 s; depois a mensagem vai para a fila de erros (.dlq).
          enabled: true
          max-retries: 3
          initial-interval: 2s
          multiplier: 3
          max-interval: 18s

  mail:
    # Sem MAIL_HOST a aplicação sobe e só registra no log quem receberia cada e-mail.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USUARIO:}
    password: ${MAIL_SENHA:}
    properties:
      # Um SMTP lento não pode prender o consumidor: falhou em 3 s, entra nas tentativas.
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
      mail.smtp.starttls.enable: true

  data:
    web:
      pageable:
        # Impede que um cliente peça uma página gigante e derrube o banco.
        max-page-size: 100

  mvc:
    format:
      # Datas e horas na query string sempre em ISO 8601 (2026-10-21, 2026-10-21T11:00:00Z).
      date: iso
      date-time: iso
      time: iso

  web:
    # Mensagens de validação sempre em português, independentemente do idioma do navegador.
    locale: pt_BR
    locale-resolver: fixed

server:
  shutdown: graceful
  error:
    include-stacktrace: never

seguranca:
  # Chave HMAC dos tokens, em Base64 (mínimo de 32 bytes). Gere com: openssl rand -base64 32
  jwt-segredo: ${JWT_SEGREDO}
  origens-permitidas: ${CORS_ORIGENS:http://localhost:4200}
  admin-email: ${ADMIN_EMAIL:}
  admin-senha: ${ADMIN_SENHA:}

agendamento:
  notificacoes:
    remetente: ${MAIL_REMETENTE:Barbearia Tonelli <nao-responder@localhost>}

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

management:
  health:
    # Broker ou SMTP fora do ar não derrubam a API: a reserva continua funcionando, só os avisos param.
    rabbit:
      enabled: false
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
